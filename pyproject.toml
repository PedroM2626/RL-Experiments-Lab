[project]
name = "mle-procgen-benchmark"
version = "1.0.0"
description = "Systematic benchmark of visual architectures, world models and exploration in Procgen"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pedro Morato Lahoz" }]

# Dependency pins live in requirements.txt (PyTorch/SB3 study, CUDA wheels) and
# jax_port/requirements-jax.txt (JAX port venv, WSL). They cannot be merged: the two
# stacks need conflicting numpy/gym versions (see README section 13.2), and neither
# is installable as a PEP 621 extra here because torch must come from the cu121 index.

# Lint gate (added 24/10/2026): the pyflakes rules that are mechanically safe.
# F841 (unused locals) joined on 30/10/2026 after a manual pass over its 17 sites: calls
# with side effects (flax self.param, env.reset, fixture writers) were kept as bare
# statements, so no parameter tree or published result changed.
[tool.ruff.lint]
select = ["F401", "F541", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*np.bool8.*",
]
